name: One-shot mypy debt repair v2

on:
  push:
    branches:
      - feat/phase-b-iam-governance

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-b-iam-governance
          fetch-depth: 0

      - name: 安装 GeoDjango 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true

      - name: 复用精确修复脚本并校正类型工具版本
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-mypy-repair.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'one-shot-mypy-repair.yml', 'exec'))

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('"django-stubs>=5.2,<6"', '"django-stubs>=6.0.7,<6.1"')
          text = text.replace(
              '"djangorestframework-stubs>=3.17,<3.18"',
              '"djangorestframework-stubs>=3.17.1,<3.18"',
          )
          pyproject.write_text(text, encoding='utf-8')
          PY

      - name: 安装修复后的依赖
        run: uv sync --group dev

      - name: strict mypy 验证
        run: uv run mypy backend

      - name: Ruff 验证
        run: uv run ruff check .

      - name: 提交已验证的类型修复
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/spatial_fabric/iam/models.py \
                  backend/spatial_fabric/assets/models.py \
                  pyproject.toml
          git commit -m "fix: satisfy strict mypy across Phase A and B1"
          git push origin HEAD:feat/phase-b-iam-governance
