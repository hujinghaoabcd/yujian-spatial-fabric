name: One-shot B2.4 elevation migration

on:
  push:
    branches:
      - feat/phase-b2-governance-controls

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: spatial_fabric_test
          POSTGRES_USER: spatial_fabric
          POSTGRES_PASSWORD: spatial_fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spatial_fabric -d spatial_fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SF_ENV: test
      SF_SECRET_KEY: ci-only-not-production
      POSTGRES_DB: spatial_fabric_test
      POSTGRES_USER: spatial_fabric
      POSTGRES_PASSWORD: spatial_fabric_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-b2-governance-controls
          fetch-depth: 0

      - name: 安装 GeoDjango 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --group dev

      - name: 收口 B2.4 强类型、authority evidence 与 Break-glass 幂等契约
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}.")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all_exact(path: Path, old: str, new: str, expected: int, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} anchors, found {count}.")
              path.write_text(text.replace(old, new), encoding="utf-8")

          def replace_block(path: Path, start_marker: str, end_marker: str, new_block: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              starts = [i for i in range(len(text)) if text.startswith(start_marker, i)]
              if len(starts) != 1:
                  raise SystemExit(f"{label}: expected one start marker, found {len(starts)}.")
              start = starts[0]
              end = text.find(end_marker, start + len(start_marker))
              if end == -1:
                  raise SystemExit(f"{label}: end marker not found.")
              path.write_text(text[:start] + new_block + text[end:], encoding="utf-8")

          models_path = Path("backend/spatial_fabric/elevation/models.py")
          services_path = Path("backend/spatial_fabric/elevation/services.py")
          tests_path = Path("backend/spatial_fabric/tests/test_phase_b2_elevated_access.py")
          spec_path = Path("docs/database/phase-b2-elevated-access-spec.md")

          # ---------- Models: idempotency / authority snapshots ----------
          replace_once(
              models_path,
              '''resource_kind_validator = RegexValidator(
              regex=r"^[a-z][a-z0-9_.:-]{0,159}$",
              message="resource_kind 必须以小写字母开头，且只能包含小写字母、数字、._:-。",
          )
          ''',
              '''resource_kind_validator = RegexValidator(
              regex=r"^[a-z][a-z0-9_.:-]{0,159}$",
              message="resource_kind 必须以小写字母开头，且只能包含小写字母、数字、._:-。",
          )
          idempotency_key_validator = RegexValidator(
              regex=r"^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,159}$",
              message="idempotency_key 只能包含字母、数字、._:/-，且必须以字母或数字开头。",
          )
          ''',
              "idempotency validator",
          )

          replace_once(
              models_path,
              '''    comment = models.TextField("审批意见", blank=True)
              decided_at = models.DateTimeField("审批时间", default=timezone.now)
          ''',
              '''    comment = models.TextField("审批意见", blank=True)
              authority_snapshot = models.JSONField(
                  "审批 authority evidence",
                  default=dict,
                  blank=True,
                  help_text="保存作出审批决定时 authority checker 的可解释证据。",
              )
              decided_at = models.DateTimeField("审批时间", default=timezone.now)
          ''',
              "approval authority snapshot field",
          )

          replace_once(
              models_path,
              '''    emergency_reason = models.TextField("紧急访问原因", blank=True, default="")
              notification_required = models.BooleanField("必须触发安全通知", default=False)
              activated_by = models.ForeignKey(
          ''',
              '''    emergency_reason = models.TextField("紧急访问原因", blank=True, default="")
              notification_required = models.BooleanField("必须触发安全通知", default=False)
              idempotency_key = models.CharField(
                  "激活幂等键",
                  max_length=160,
                  validators=[idempotency_key_validator],
                  blank=True,
                  default="",
                  help_text="BREAK_GLASS 必填；JIT 通过 source ApprovalRequest 自带幂等 identity。",
              )
              activation_authority_snapshot = models.JSONField(
                  "激活 authority evidence",
                  default=dict,
                  blank=True,
                  help_text="Break-glass 激活时保存 authority checker evidence；JIT 通常为空。",
              )
              activated_by = models.ForeignKey(
          ''',
              "temporary access evidence fields",
          )

          replace_once(
              models_path,
              '''                    models.Q(
                                  mode=TemporaryAccessMode.JIT,
                                  source_approval_request__isnull=False,
                                  emergency_reason="",
                              )
          ''',
              '''                    models.Q(
                                  mode=TemporaryAccessMode.JIT,
                                  source_approval_request__isnull=False,
                                  emergency_reason="",
                                  idempotency_key="",
                              )
          ''',
              "JIT mode shape idempotency",
          )

          replace_once(
              models_path,
              '''                        models.Q(
                                      mode=TemporaryAccessMode.BREAK_GLASS,
                                      notification_required=True,
                                  )
                                  & ~models.Q(emergency_reason="")
          ''',
              '''                        models.Q(
                                      mode=TemporaryAccessMode.BREAK_GLASS,
                                      notification_required=True,
                                  )
                                  & ~models.Q(emergency_reason="")
                                  & ~models.Q(idempotency_key="")
          ''',
              "break-glass mode shape idempotency",
          )

          replace_once(
              models_path,
              '''            models.UniqueConstraint(
                          fields=["source_approval_request"],
                          condition=models.Q(source_approval_request__isnull=False),
                          name="sf_tmpgrant_apreq_uniq",
                      ),
          ''',
              '''            models.UniqueConstraint(
                          fields=["source_approval_request"],
                          condition=models.Q(source_approval_request__isnull=False),
                          name="sf_tmpgrant_apreq_uniq",
                      ),
                      models.UniqueConstraint(
                          fields=["tenant", "activated_by", "idempotency_key"],
                          condition=models.Q(mode=TemporaryAccessMode.BREAK_GLASS),
                          name="sf_tmpgrant_bg_idem_uniq",
                      ),
          ''',
              "break-glass idempotency unique",
          )

          replace_once(
              models_path,
              '''        if self.mode == TemporaryAccessMode.JIT:
                      if approval is None:
                          errors["source_approval_request"] = "JIT 必须来源于已批准 ApprovalRequest。"
                      elif approval.purpose != ApprovalPurpose.JIT_ELEVATION:
                          errors["source_approval_request"] = "JIT 来源 ApprovalRequest purpose 必须为 JIT_ELEVATION。"
                      if self.emergency_reason:
                          errors["emergency_reason"] = "JIT 不应携带 emergency_reason。"
                  elif self.mode == TemporaryAccessMode.BREAK_GLASS:
                      if not self.emergency_reason.strip():
                          errors["emergency_reason"] = "Break-glass 必须记录强理由。"
                      if not self.notification_required:
                          errors["notification_required"] = "Break-glass 必须触发安全通知要求。"
          ''',
              '''        if self.mode == TemporaryAccessMode.JIT:
                      if approval is None:
                          errors["source_approval_request"] = "JIT 必须来源于已批准 ApprovalRequest。"
                      elif approval.purpose != ApprovalPurpose.JIT_ELEVATION:
                          errors["source_approval_request"] = "JIT 来源 ApprovalRequest purpose 必须为 JIT_ELEVATION。"
                      if self.emergency_reason:
                          errors["emergency_reason"] = "JIT 不应携带 emergency_reason。"
                      if self.idempotency_key:
                          errors["idempotency_key"] = "JIT 不使用 Break-glass idempotency_key。"
                  elif self.mode == TemporaryAccessMode.BREAK_GLASS:
                      if not self.emergency_reason.strip():
                          errors["emergency_reason"] = "Break-glass 必须记录强理由。"
                      if not self.notification_required:
                          errors["notification_required"] = "Break-glass 必须触发安全通知要求。"
                      if not self.idempotency_key:
                          errors["idempotency_key"] = "Break-glass 必须提供 idempotency_key。"
          ''',
              "temporary access clean mode rules",
          )

          replace_once(
              models_path,
              '''        if not self.reason.strip():
                      errors["reason"] = "TemporaryAccessGrant 必须记录原因。"
          ''',
              '''        if not self.reason.strip():
                      errors["reason"] = "TemporaryAccessGrant 必须记录原因。"
                  if not isinstance(self.activation_authority_snapshot, dict):
                      errors["activation_authority_snapshot"] = "activation_authority_snapshot 必须是 JSON object。"
          ''',
              "temporary authority snapshot validation",
          )

          # ---------- Services: strong datetime typing ----------
          replace_once(
              services_path,
              "from datetime import timedelta\n",
              "from datetime import datetime, timedelta\n",
              "datetime import",
          )
          replace_once(
              services_path,
              "from django.db.models import Q, QuerySet\n",
              "from django.db.models import Q\n",
              "unused QuerySet import",
          )
          replace_all_exact(services_path, "at: object | None", "at: datetime | None", 12, "nullable datetime annotations")
          replace_all_exact(services_path, " at: object", " at: datetime", 3, "protocol datetime annotations")
          replace_all_exact(services_path, "expires_at: object", "expires_at: datetime", 1, "approval expires_at annotation")
          replace_all_exact(services_path, "requested_valid_until: object | None", "requested_valid_until: datetime | None", 1, "requested_valid_until annotation")
          replace_all_exact(services_path, "valid_until: object", "valid_until: datetime", 1, "delegation valid_until annotation")

          # Approval decision must persist checker evidence.
          replace_once(
              services_path,
              '''            evidence = ApprovalDecision(
                          approval_request=request,
                          decision=decision,
                          approver=approver,
                          comment=comment,
                          decided_at=moment,
                      )
          ''',
              '''            evidence = ApprovalDecision(
                          approval_request=request,
                          decision=decision,
                          approver=approver,
                          comment=comment,
                          authority_snapshot=authority.evidence,
                          decided_at=moment,
                      )
          ''',
              "approval evidence persistence",
          )

          # Delegation 写服务必须把共享查询/Scope 错误收口为稳定领域错误，避免异常类型泄漏。
          replace_once(
              services_path,
              "        context = _ScopeLoader.load(scope_ref)\n"
              "        delegator = _ElevationQuery.active_principal(\n"
              "            principal_id=delegator_id,\n"
              "            tenant_id=scope_ref.tenant_id,\n"
              "        )\n"
              "        delegatee = _ElevationQuery.active_principal(\n"
              "            principal_id=delegatee_id,\n"
              "            tenant_id=scope_ref.tenant_id,\n"
              "        )\n"
              "        _ElevationQuery.governance_actor(\n"
              "            principal_id=created_by_id,\n"
              "            tenant_id=scope_ref.tenant_id,\n"
              "        )\n"
              "        privileges = _ElevationQuery.active_privileges(privilege_keys)\n",
              "        try:\n"
              "            context = _ScopeLoader.load(scope_ref)\n"
              "            delegator = _ElevationQuery.active_principal(\n"
              "                principal_id=delegator_id,\n"
              "                tenant_id=scope_ref.tenant_id,\n"
              "            )\n"
              "            delegatee = _ElevationQuery.active_principal(\n"
              "                principal_id=delegatee_id,\n"
              "                tenant_id=scope_ref.tenant_id,\n"
              "            )\n"
              "            _ElevationQuery.governance_actor(\n"
              "                principal_id=created_by_id,\n"
              "                tenant_id=scope_ref.tenant_id,\n"
              "            )\n"
              "            privileges = _ElevationQuery.active_privileges(privilege_keys)\n"
              "        except ElevatedAccessError as exc:\n"
              "            raise DelegationControlError(\n"
              "                \"Delegation 主体、Scope 或 Privilege 无效，已 fail closed。\"\n"
              "            ) from exc\n",
              "delegation domain error boundary",
          )

          # Replace the whole Break-glass method so idempotency semantics are reviewed as one atomic contract.
          new_break_glass = '''    def activate_break_glass(
              self,
              *,
              beneficiary_id: UUID,
              activated_by_id: UUID,
              scope_ref: ElevatedScopeRef,
              privilege_keys: tuple[str, ...],
              emergency_reason: str,
              ttl: timedelta,
              idempotency_key: str,
              at: datetime | None = None,
          ) -> TemporaryAccessGrant:
              moment = at or timezone.now()
              if ttl <= timedelta(0) or ttl > BREAK_GLASS_MAX_TTL:
                  raise TemporaryAccessControlError("Break-glass TTL 必须大于 0 且不超过 60 分钟。")
              reason = emergency_reason.strip()
              if not reason:
                  raise TemporaryAccessControlError("Break-glass 必须记录紧急访问强理由。")
              if not idempotency_key.strip():
                  raise TemporaryAccessControlError("Break-glass 必须提供 idempotency_key。")
              context = _ScopeLoader.load(scope_ref)
              beneficiary = _ElevationQuery.active_principal(
                  principal_id=beneficiary_id,
                  tenant_id=scope_ref.tenant_id,
              )
              _ElevationQuery.governance_actor(
                  principal_id=activated_by_id,
                  tenant_id=scope_ref.tenant_id,
              )
              privileges = _ElevationQuery.active_privileges(privilege_keys)
              keys = tuple(privilege.key for privilege in privileges)

              with transaction.atomic():
                  existing = (
                      TemporaryAccessGrant.objects.select_for_update()
                      .filter(
                          tenant_id=scope_ref.tenant_id,
                          activated_by_id=activated_by_id,
                          mode=TemporaryAccessMode.BREAK_GLASS,
                          idempotency_key=idempotency_key,
                      )
                      .first()
                  )
                  if existing is not None:
                      self._validate_break_glass_fingerprint(
                          grant=existing,
                          context=context,
                          beneficiary_id=beneficiary_id,
                          privilege_keys=keys,
                          emergency_reason=reason,
                          ttl=ttl,
                      )
                      return existing

                  if self.break_glass_checker is None:
                      raise TemporaryAccessControlError("未配置 BreakGlassAuthorityChecker，必须 fail closed。")
                  try:
                      authority = self.break_glass_checker.can_activate(
                          actor_id=activated_by_id,
                          beneficiary_id=beneficiary_id,
                          scope_ref=scope_ref,
                          privilege_keys=keys,
                          at=moment,
                      )
                  except Exception as exc:
                      raise TemporaryAccessControlError(
                          "Break-glass authority checker 失败，已 fail closed。"
                      ) from exc
                  if not authority.allowed:
                      raise TemporaryAccessControlError("激活主体当前没有 Break-glass authority。")
                  boundary = self.boundary_resolver.resolve(
                      principal_id=beneficiary.id,
                      scope_ref=scope_ref,
                      candidate_privilege_keys=keys,
                      at=moment,
                  )
                  if set(boundary.allowed_privilege_keys) != set(keys):
                      raise TemporaryAccessControlError(
                          "Break-glass 请求超出 beneficiary PermissionBoundary。"
                      )

                  defaults = {
                      "beneficiary": beneficiary,
                      "scope_type": context.exact_type,
                      "valid_from": moment,
                      "valid_until": moment + ttl,
                      "reason": reason,
                      "emergency_reason": reason,
                      "notification_required": True,
                      "activation_authority_snapshot": authority.evidence,
                      **_ElevationQuery.exact_scope_defaults(context),
                  }
                  grant, created = TemporaryAccessGrant.objects.get_or_create(
                      tenant_id=scope_ref.tenant_id,
                      activated_by_id=activated_by_id,
                      mode=TemporaryAccessMode.BREAK_GLASS,
                      idempotency_key=idempotency_key,
                      defaults=defaults,
                  )
                  grant = TemporaryAccessGrant.objects.select_for_update().get(pk=grant.pk)
                  if not created:
                      self._validate_break_glass_fingerprint(
                          grant=grant,
                          context=context,
                          beneficiary_id=beneficiary_id,
                          privilege_keys=keys,
                          emergency_reason=reason,
                          ttl=ttl,
                      )
                      return grant
                  grant.full_clean()
                  grant.save()
                  for privilege in privileges:
                      link = TemporaryAccessGrantPrivilege(grant=grant, privilege=privilege)
                      link.full_clean()
                      link.save()
                  return grant

              @staticmethod
              def _validate_break_glass_fingerprint(
                  *,
                  grant: TemporaryAccessGrant,
                  context: _ScopeContext,
                  beneficiary_id: UUID,
                  privilege_keys: tuple[str, ...],
                  emergency_reason: str,
                  ttl: timedelta,
              ) -> None:
                  expected_scope = _ElevationQuery.exact_scope_defaults(context)
                  existing_keys = set(
                      TemporaryAccessGrantPrivilege.objects.filter(grant=grant).values_list(
                          "privilege__key", flat=True
                      )
                  )
                  if (
                      grant.beneficiary_id != beneficiary_id
                      or grant.scope_type != context.exact_type
                      or grant.workspace_id != expected_scope["workspace_id"]
                      or grant.project_id != expected_scope["project_id"]
                      or grant.environment_id != expected_scope["environment_id"]
                      or grant.emergency_reason != emergency_reason
                      or grant.reason != emergency_reason
                      or grant.valid_until - grant.valid_from != ttl
                      or existing_keys != set(privilege_keys)
                  ):
                      raise TemporaryAccessControlError(
                          "同一 Break-glass idempotency_key 被用于不同 request fingerprint。"
                      )

          '''
          first_line, separator, remaining_lines = new_break_glass.partition("\n")
          new_break_glass = first_line + separator + textwrap.indent(remaining_lines, "    ")
          helper_marker = "\n        @staticmethod\n        def _validate_break_glass_fingerprint(\n"
          helper_start = new_break_glass.find(helper_marker)
          if helper_start == -1:
              raise SystemExit("break-glass fingerprint helper marker not found.")
          helper_body = new_break_glass[helper_start + 1 :]
          new_break_glass = new_break_glass[: helper_start + 1] + textwrap.indent(
              textwrap.dedent(helper_body), "    "
          )
          replace_block(
              services_path,
              "    def activate_break_glass(\n",
              "    def revoke(\n",
              new_break_glass,
              "break-glass method",
          )

          # ---------- Tests: Protocol implementations use exact UUID types ----------
          replace_once(
              tests_path,
              "from uuid import uuid4\n",
              "from uuid import UUID, uuid4\n",
              "test UUID import",
          )
          for old, new, expected, label in (
              ("approver_id: object", "approver_id: UUID", 1, "approval checker approver type"),
              ("actor_id: object", "actor_id: UUID", 1, "breakglass checker actor type"),
              ("beneficiary_id: object", "beneficiary_id: UUID", 1, "breakglass checker beneficiary type"),
              ("delegator_id: object", "delegator_id: UUID", 1, "delegation checker delegator type"),
          ):
              replace_all_exact(tests_path, old, new, expected, label)

          # ---------- Spec: persist the security refinements before schema freeze ----------
          spec_text = spec_path.read_text(encoding="utf-8")
          amendment = '''

          ---

          ## 11. Schema freeze 前安全补充

          B2.4 migration 冻结前进一步明确：

          1. `ApprovalService.decide()` 必须注入 `ApprovalAuthorityChecker`；仅“同租户且不是 requester”不足以证明审批权限。checker 缺失/异常/拒绝时 fail closed。
          2. `ApprovalDecision.authority_snapshot` 保存作出最终决定时的 checker evidence，避免只知道“谁批准了”却无法解释“凭什么有权批准”。
          3. `TemporaryAccessGrant.activation_authority_snapshot` 保存 Break-glass 激活时 checker evidence；JIT 的主要 authority evidence 来自 source ApprovalRequest/Decision。
          4. Break-glass 必须携带 `idempotency_key`。同 Tenant + activated_by + key 唯一；同 key 重试只有 request fingerprint 完全一致时才返回原 grant，否则 fail closed。
          5. Break-glass fingerprint 至少覆盖 beneficiary、Scope、Privilege set、emergency reason 与 TTL，防止把一个成功幂等键复用于另一种紧急访问。
          6. JIT 不使用 Break-glass idempotency key；其幂等 identity 由唯一的 source ApprovalRequest 提供。

          这些补充不改变 B2.4 总体对象边界，只把 authority 与网络重试的审计/并发语义补齐。
          '''
          if "## 11. Schema freeze 前安全补充" in spec_text:
              raise SystemExit("B2.4 security supplement already exists; refusing duplicate patch.")
          spec_path.write_text(spec_text.rstrip() + amendment + "\n", encoding="utf-8")
          PY

      - name: 规范化 B2.4 源码与测试
        run: >-
          uv run ruff check --fix
          backend/spatial_fabric/elevation/models.py
          backend/spatial_fabric/elevation/services.py
          backend/spatial_fabric/tests/test_phase_b2_elevated_access.py

      - name: Django 系统检查
        run: uv run python backend/manage.py check

      - name: 由 Django 生成 elevation migration
        run: uv run python backend/manage.py makemigrations elevation

      - name: 从空 PostGIS 执行完整 migrations
        run: uv run python backend/manage.py migrate --noinput

      - name: 运行全部领域测试
        run: uv run pytest --cov=backend/spatial_fabric --cov-report=term-missing

      - name: Provider 泄漏检查
        run: uv run python scripts/check_provider_leaks.py

      - name: Ruff
        run: uv run ruff check .

      - name: strict mypy
        run: uv run mypy backend

      - name: 确认生成 migration 后模型同步
        run: uv run python backend/manage.py makemigrations --check --dry-run

      - name: 提交已验证的 B2.4 source contract 与 Django migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/spatial_fabric/elevation/models.py \
            backend/spatial_fabric/elevation/services.py \
            backend/spatial_fabric/elevation/migrations/ \
            backend/spatial_fabric/tests/test_phase_b2_elevated_access.py \
            docs/database/phase-b2-elevated-access-spec.md
          if git diff --cached --quiet; then
            echo "No verified B2.4 changes generated."
            exit 1
          fi
          git commit -m "db: add verified B2.4 elevated access schema"
          git push origin HEAD:feat/phase-b2-governance-controls
