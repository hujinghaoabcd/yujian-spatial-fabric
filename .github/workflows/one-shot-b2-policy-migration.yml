name: One-shot B2 policy migration

on:
  push:
    branches:
      - feat/phase-b2-governance-controls

permissions:
  contents: write

jobs:
  generate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: spatial_fabric_test
          POSTGRES_USER: spatial_fabric
          POSTGRES_PASSWORD: spatial_fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spatial_fabric -d spatial_fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SF_ENV: test
      SF_SECRET_KEY: ci-only-not-production
      POSTGRES_DB: spatial_fabric_test
      POSTGRES_USER: spatial_fabric
      POSTGRES_PASSWORD: spatial_fabric_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-b2-governance-controls
          fetch-depth: 0

      - name: 安装 GeoDjango 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --group dev

      - name: Django 系统检查
        run: uv run python backend/manage.py check

      - name: 由 Django 生成 governance migration
        run: uv run python backend/manage.py makemigrations governance

      - name: 从空 PostGIS 执行完整 migrations
        run: uv run python backend/manage.py migrate --noinput

      - name: 运行全部领域测试
        run: uv run pytest --cov=backend/spatial_fabric --cov-report=term-missing

      - name: Provider 泄漏检查
        run: uv run python scripts/check_provider_leaks.py

      - name: Ruff
        run: uv run ruff check .

      - name: strict mypy
        run: uv run mypy backend

      - name: 确认生成 migration 后模型同步
        run: uv run python backend/manage.py makemigrations --check --dry-run

      - name: 提交 Django 原生生成的 migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/spatial_fabric/governance/migrations/
          if git diff --cached --quiet; then
            echo "No migration generated."
            exit 1
          fi
          git commit -m "db: add Django-generated B2.1 policy core migration"
          git push origin HEAD:feat/phase-b2-governance-controls
