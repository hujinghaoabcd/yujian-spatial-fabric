name: One-shot B2.3 commercial finalize

on:
  push:
    branches:
      - feat/phase-b2-governance-controls

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: spatial_fabric_test
          POSTGRES_USER: spatial_fabric
          POSTGRES_PASSWORD: spatial_fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spatial_fabric -d spatial_fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SF_ENV: test
      SF_SECRET_KEY: ci-only-not-production
      POSTGRES_DB: spatial_fabric_test
      POSTGRES_USER: spatial_fabric
      POSTGRES_PASSWORD: spatial_fabric_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-b2-governance-controls
          fetch-depth: 0

      - name: 安装 GeoDjango 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --group dev

      - name: 精确收口 B2.3 源码契约
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_lines(path: Path, old: list[str], new: list[str], label: str) -> None:
              lines = path.read_text(encoding="utf-8").splitlines()
              indexes = [
                  index
                  for index in range(len(lines) - len(old) + 1)
                  if lines[index:index + len(old)] == old
              ]
              if len(indexes) != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {len(indexes)}.")
              index = indexes[0]
              lines[index:index + len(old)] = new
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          models_path = Path("backend/spatial_fabric/commercial/models.py")
          services_path = Path("backend/spatial_fabric/commercial/services.py")
          tests_path = Path("backend/spatial_fabric/tests/test_phase_b2_commercial_controls.py")

          # 1. Typed evidence：幂等重试必须能原样重放 decision-time counter 快照。
          replace_lines(
              models_path,
              [
                  '    enforcement_mode_snapshot = models.CharField(',
                  '        "执行模式快照", max_length=16, choices=EnforcementMode.choices',
                  '    )',
                  '    projected_value_snapshot = models.PositiveBigIntegerField("决策时 projected 值")',
                  '    exceeded_snapshot = models.BooleanField("决策时是否超限", default=False)',
              ],
              [
                  '    enforcement_mode_snapshot = models.CharField(',
                  '        "执行模式快照", max_length=16, choices=EnforcementMode.choices',
                  '    )',
                  '    consumed_value_snapshot = models.PositiveBigIntegerField("决策时已消费值快照")',
                  '    reserved_value_snapshot = models.PositiveBigIntegerField("决策时已预留值快照")',
                  '    projected_value_snapshot = models.PositiveBigIntegerField("决策时 projected 值")',
                  '    exceeded_snapshot = models.BooleanField("决策时是否超限", default=False)',
              ],
              "UsageReservationQuota snapshot fields",
          )

          # 2. 清除一处错误消息中的零宽字符。
          model_lines = models_path.read_text(encoding="utf-8").splitlines()
          typo_indexes = [
              index
              for index, line in enumerate(model_lines)
              if "ReservationQuota.Quo" in line and "必须属于同一 Tenant" in line
          ]
          if len(typo_indexes) != 1:
              raise SystemExit(
                  f"ReservationQuota error-message anchor: expected 1, found {len(typo_indexes)}."
              )
          model_lines[typo_indexes[0]] = (
              '            errors["quota"] = "ReservationQuota.Quota 必须属于同一 Tenant。"'
          )
          models_path.write_text("\n".join(model_lines) + "\n", encoding="utf-8")

          # 3. Quota 写服务把共享 ScopeLoader 的错误收口为稳定的 QuotaControlError。
          replace_lines(
              services_path,
              [
                  '        moment = at or timezone.now()',
                  '        context = _ScopeLoader.load(scope_ref)',
                  '        principal = _CommercialQuery.active_principal(',
                  '            principal_id=principal_id,',
                  '            tenant_id=scope_ref.tenant_id,',
                  '        )',
                  '        scope_defaults = self._exact_scope_defaults(context)',
              ],
              [
                  '        moment = at or timezone.now()',
                  '        try:',
                  '            context = _ScopeLoader.load(scope_ref)',
                  '            principal = _CommercialQuery.active_principal(',
                  '                principal_id=principal_id,',
                  '                tenant_id=scope_ref.tenant_id,',
                  '            )',
                  '        except CommercialControlError as exc:',
                  '            # ScopeLoader 被 Entitlement/Budget/Quota 共享；Quota 写服务必须把共享基础异常',
                  '            # 收口成稳定 QuotaControlError，避免调用方依赖内部 loader 的异常层级。',
                  '            if isinstance(exc, QuotaControlError):',
                  '                raise',
                  '            raise QuotaControlError(str(exc)) from exc',
                  '        scope_defaults = self._exact_scope_defaults(context)',
              ],
              "UsageReservationService exception boundary",
          )

          replace_lines(
              services_path,
              [
                  '                    limit_snapshot=quota.limit_value,',
                  '                    enforcement_mode_snapshot=quota.enforcement_mode,',
                  '                    projected_value_snapshot=evidence.projected_value,',
                  '                    exceeded_snapshot=evidence.exceeded,',
              ],
              [
                  '                    limit_snapshot=quota.limit_value,',
                  '                    enforcement_mode_snapshot=quota.enforcement_mode,',
                  '                    consumed_value_snapshot=evidence.consumed_value,',
                  '                    reserved_value_snapshot=evidence.reserved_value,',
                  '                    projected_value_snapshot=evidence.projected_value,',
                  '                    exceeded_snapshot=evidence.exceeded,',
              ],
              "ReservationQuota evidence persistence",
          )

          replace_lines(
              services_path,
              [
                  '                consumed_value=link.projected_value_snapshot - link.amount,',
                  '                reserved_value=0,',
              ],
              [
                  '                consumed_value=link.consumed_value_snapshot,',
                  '                reserved_value=link.reserved_value_snapshot,',
              ],
              "Idempotent decision evidence replay",
          )

          # 4. strict mypy：显式使用已判空的局部 FK，而不是再次访问 nullable descriptor。
          for prefix in ("", "Quota "):
              old_workspace = (
                  '            elif self.workspace.tenant_id != self.tenant_id:'
              )
              old_project = '            elif self.project.tenant_id != self.tenant_id:'
              old_environment = '            elif self.environment.tenant_id != self.tenant_id:'
              # 这三个模式在 Entitlement helper 与 Quota helper 各出现一次，因此分两轮逐一替换。
              for old, new, label in (
                  (old_workspace, '            elif workspace.tenant_id != self.tenant_id:', f"{prefix}workspace narrowing"),
                  (old_project, '            elif project.tenant_id != self.tenant_id:', f"{prefix}project narrowing"),
                  (old_environment, '            elif environment.tenant_id != self.tenant_id:', f"{prefix}environment narrowing"),
              ):
                  lines = models_path.read_text(encoding="utf-8").splitlines()
                  indexes = [index for index, line in enumerate(lines) if line == old]
                  if not indexes:
                      raise SystemExit(f"{label}: no remaining anchor.")
                  index = indexes[0]
                  lines[index] = new
                  models_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # Budget 使用 clean() 中已经显式判空的局部变量。
          for old, new, label in (
              ('            elif self.workspace.tenant_id != self.tenant_id:', '            elif workspace.tenant_id != self.tenant_id:', "Budget workspace narrowing"),
              ('            elif self.project.tenant_id != self.tenant_id:', '            elif project.tenant_id != self.tenant_id:', "Budget project narrowing"),
              ('            elif self.environment.tenant_id != self.tenant_id:', '            elif environment.tenant_id != self.tenant_id:', "Budget environment narrowing"),
          ):
              lines = models_path.read_text(encoding="utf-8").splitlines()
              indexes = [index for index, line in enumerate(lines) if line == old]
              if not indexes:
                  raise SystemExit(f"{label}: no remaining anchor.")
              index = indexes[0]
              lines[index] = new
              models_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # UsageReservation helper 先建立局部 nullable FK，再靠分支判空完成类型收窄。
          replace_lines(
              models_path,
              [
                  '    def _validate_scope(self, errors: dict[str, str]) -> None:',
                  '        if self.scope_type == CommercialScopeType.TENANT:',
              ],
              [
                  '    def _validate_scope(self, errors: dict[str, str]) -> None:',
                  '        workspace = self.workspace if self.workspace_id else None',
                  '        project = self.project if self.project_id else None',
                  '        environment = self.environment if self.environment_id else None',
                  '',
                  '        if self.scope_type == CommercialScopeType.TENANT:',
              ],
              "UsageReservation local scope values",
          )
          for old, new, label in (
              ('            elif self.workspace.tenant_id != self.tenant_id:', '            elif workspace.tenant_id != self.tenant_id:', "UsageReservation workspace narrowing"),
              ('            elif self.project.tenant_id != self.tenant_id:', '            elif project.tenant_id != self.tenant_id:', "UsageReservation project narrowing"),
              ('            elif self.environment.tenant_id != self.tenant_id:', '            elif environment.tenant_id != self.tenant_id:', "UsageReservation environment narrowing"),
          ):
              lines = models_path.read_text(encoding="utf-8").splitlines()
              indexes = [index for index, line in enumerate(lines) if line == old]
              if len(indexes) != 1:
                  raise SystemExit(f"{label}: expected one remaining anchor, found {len(indexes)}.")
              lines[indexes[0]] = new
              models_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          # 5. 测试不再把异构参数塞进 dict[str, object] 再 ** 展开，保持 strict typing。
          replace_lines(
              tests_path,
              [
                  '    service = UsageReservationService()',
                  '    kwargs = {',
                  '        "principal_id": user.id,',
                  '        "metric_key": "concurrent_jobs",',
                  '        "measurement_type": QuotaMeasurementType.CONCURRENCY,',
                  '        "unit": "count",',
                  '        "scope_ref": CommercialScopeRef(tenant.id, CommercialScopeType.TENANT),',
                  '        "amount": 2,',
                  '        "idempotency_key": "idem-001",',
                  '    }',
                  '',
                  '    first = service.reserve_for_context(**kwargs)',
                  '    second = service.reserve_for_context(**kwargs)',
                  '',
                  '    assert second.reservation_id == first.reservation_id',
                  '    assert UsageReservation.objects.count() == 1',
                  '    assert UsageCounter.objects.get(quota=quota).reserved_value == 2',
              ],
              [
                  '    service = UsageReservationService()',
                  '    UsageCounter.objects.create(',
                  '        tenant=tenant,',
                  '        quota=quota,',
                  '        consumed_value=3,',
                  '        reserved_value=1,',
                  '    )',
                  '    first = service.reserve_for_context(',
                  '        principal_id=user.id,',
                  '        metric_key="concurrent_jobs",',
                  '        measurement_type=QuotaMeasurementType.CONCURRENCY,',
                  '        unit="count",',
                  '        scope_ref=CommercialScopeRef(tenant.id, CommercialScopeType.TENANT),',
                  '        amount=2,',
                  '        idempotency_key="idem-001",',
                  '    )',
                  '    second = service.reserve_for_context(',
                  '        principal_id=user.id,',
                  '        metric_key="concurrent_jobs",',
                  '        measurement_type=QuotaMeasurementType.CONCURRENCY,',
                  '        unit="count",',
                  '        scope_ref=CommercialScopeRef(tenant.id, CommercialScopeType.TENANT),',
                  '        amount=2,',
                  '        idempotency_key="idem-001",',
                  '    )',
                  '',
                  '    assert second.reservation_id == first.reservation_id',
                  '    assert second.evidence == first.evidence',
                  '    assert first.evidence[0].consumed_value == 3',
                  '    assert first.evidence[0].reserved_value == 1',
                  '    assert UsageReservation.objects.count() == 1',
                  '    assert UsageCounter.objects.get(quota=quota).reserved_value == 3',
              ],
              "Idempotency strict-typed evidence test",
          )
          PY

      - name: 规范化 B2.3 源文件格式
        run: >-
          uv run ruff check --fix
          backend/spatial_fabric/commercial/models.py
          backend/spatial_fabric/commercial/services.py
          backend/spatial_fabric/tests/test_phase_b2_commercial_controls.py

      - name: Django 系统检查
        run: uv run python backend/manage.py check

      - name: 由 Django 生成 commercial migration
        run: uv run python backend/manage.py makemigrations commercial

      - name: 从空 PostGIS 执行完整 migrations
        run: uv run python backend/manage.py migrate --noinput

      - name: 运行全部领域测试
        run: uv run pytest --cov=backend/spatial_fabric --cov-report=term-missing

      - name: Provider 泄漏检查
        run: uv run python scripts/check_provider_leaks.py

      - name: Ruff
        run: uv run ruff check .

      - name: strict mypy
        run: uv run mypy backend

      - name: 确认生成 migration 后模型同步
        run: uv run python backend/manage.py makemigrations --check --dry-run

      - name: 提交已验证的 B2.3 源码与 Django migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/spatial_fabric/commercial/models.py \
            backend/spatial_fabric/commercial/services.py \
            backend/spatial_fabric/commercial/migrations/ \
            backend/spatial_fabric/tests/test_phase_b2_commercial_controls.py
          if git diff --cached --quiet; then
            echo "No verified B2.3 changes generated."
            exit 1
          fi
          git commit -m "db: add verified B2.3 commercial controls schema"
          git push origin HEAD:feat/phase-b2-governance-controls
