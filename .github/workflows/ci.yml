name: CI

on:
  push:
    branches: [main, feat/phase-a-foundation]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: spatial_fabric_test
          POSTGRES_USER: spatial_fabric
          POSTGRES_PASSWORD: spatial_fabric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spatial_fabric -d spatial_fabric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SF_ENV: test
      SF_SECRET_KEY: ci-only-not-production
      POSTGRES_DB: spatial_fabric_test
      POSTGRES_USER: spatial_fabric
      POSTGRES_PASSWORD: spatial_fabric_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      # GeoDjango 的 PostGIS backend 在 Python import 阶段就需要宿主机能够加载 GDAL/GEOS。
      # 数据库容器里包含 PostGIS 并不意味着 GitHub Runner 主机自动拥有这些动态库。
      - name: 安装 GeoDjango 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin libgdal-dev libgeos-dev

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 安装 Python 依赖
        run: uv sync --group dev

      - name: Django 系统检查
        run: uv run python backend/manage.py check

      # 这是首批 migration 固化前的一次性审计步骤：让与 CI 完全一致的 Django 版本实际生成
      # migration，再作为 artifact 取回审查。下一提交会把这里替换成严格的 --check --dry-run，
      # 不会长期在 CI 中动态生成 migration。
      - name: 生成 Phase A migrations（一次性审计）
        run: uv run python backend/manage.py makemigrations iam tenancy assets --verbosity 2

      - name: 导出 Django 生成的 migrations
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-migrations
          path: |
            backend/spatial_fabric/iam/migrations
            backend/spatial_fabric/tenancy/migrations
            backend/spatial_fabric/assets/migrations
          if-no-files-found: error
          retention-days: 1

      - name: Phase A 领域不变量测试（迁移固化前临时跳过 migration）
        run: uv run pytest --nomigrations --cov=backend/spatial_fabric --cov-report=term-missing

      - name: Ruff 静态检查
        run: uv run ruff check .

      - name: 依赖漏洞审计
        run: uv run pip-audit
