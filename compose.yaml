services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spatial_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-spatial_fabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spatial_fabric_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spatial_fabric} -d ${POSTGRES_DB:-spatial_fabric}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sf_postgres_data:
